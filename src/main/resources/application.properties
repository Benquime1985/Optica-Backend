spring.application.name=optica-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/optica_db}
spring.datasource.username=${DB_USERNAME:optica_user}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4200}
app.business-zone=${BUSINESS_ZONE:America/Mexico_City}

